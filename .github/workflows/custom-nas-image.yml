# Builds the custom image for one NAS from this branch, as a run artifact.
# Temporary: retire with the branch once upstream releases what it carries.
name: Custom NAS image

on:
  push:
    branches: [custom/nas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: icloud-docker-custom:${{ github.sha }}
          build-args: |
            APP_VERSION=custom-${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: Compress
        run: gzip -9 /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: icloud-docker-custom-${{ github.sha }}
          path: /tmp/image.tar.gz
          retention-days: 7
